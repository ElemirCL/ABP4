<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow - Pink Todo</title>
    <!-- Bootstrap 5.3.8 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Iconos Bootstrap  CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Mi archivo de estilos -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div class="container text-center">
        <main>
            <header class="text-center mb-2">
                <h1>Mis Tareas</h1>
                <!-- input donde se agrega descripción de la tarea -->
                <input class="inputTarea" type="text" id="input-tarea" placeholder="Añadir nueva tarea...">
                <!-- boton para agregar la tarea a la lista -->
                <button class="btn" id="btn-agregar" style="cursor: pointer;">
                    <i class="bi bi-plus-circle-fill text-primary fs-3"></i>
                </button>
            </header>
            <!--Section don de se encuentra el contenedor de las nuevas tareas -->
            <section id="contenedor-tareas" class="mt-4 text-start">
            </section>
            <section>
                <!-- Cada tarea sera agregada al siguiente div -->
                <div class="mt-4 text-start" id="contenedorTareas"></div>
            </section>
        </main>
    </div>






    <!-- Script bootstrap 5.3.8 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- Mis script -->
    <script src="assets/js/script.js"></script>
</body>

</html>
